<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政治・経済 赤シート＆穴埋め暗記マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .serif-text {
            font-family: 'Noto Serif JP', serif;
        }
        /* 赤シート用ブランク（オレンジ・赤字の暗記ペン風） */
        .blank-red {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3.5rem;
            padding: 0.1rem 0.5rem;
            margin: 0.15rem 0.15rem;
            border-radius: 0.375rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            vertical-align: baseline;
            border-bottom: 2px solid #e11d48;
        }
        .blank-red.hidden-ans {
            background-color: #ffe4e6;
            color: transparent;
            box-shadow: inset 0 1px 2px rgba(225, 29, 72, 0.15);
        }
        .blank-red.hidden-ans::after {
            content: "？？？";
            color: #f43f5e;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            position: absolute;
        }
        .blank-red.revealed {
            background-color: #fff1f2;
            color: #e11d48;
        }

        /* 黄色マーカー用ブランク */
        .blank-yellow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3.5rem;
            padding: 0.1rem 0.5rem;
            margin: 0.15rem 0.15rem;
            border-radius: 0.375rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            vertical-align: baseline;
            border-bottom: 2px solid #d97706;
        }
        .blank-yellow.hidden-ans {
            background-color: #fef3c7;
            color: transparent;
            box-shadow: inset 0 1px 2px rgba(217, 119, 6, 0.15);
        }
        .blank-yellow.hidden-ans::after {
            content: "？？？";
            color: #d97706;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            position: absolute;
        }
        .blank-yellow.revealed {
            background-color: #fffbeb;
            color: #b45309;
            background-image: linear-gradient(transparent 60%, #fde68a 60%);
        }

        /* 赤シートオーバーレイ（本物の赤い下敷き風モード） */
        body.real-red-sheet .real-sheet-target-red {
            color: #fca5a5 !important; /* 赤シート越しに見えなくなる色 */
            background-color: transparent !important;
        }
        body.real-red-sheet .real-sheet-target-yellow {
            color: #fde047 !important;
            background-color: transparent !important;
        }
        .red-sheet-overlay {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 640px;
            height: 180px;
            background-color: rgba(220, 38, 38, 0.86);
            border: 3px solid rgba(185, 28, 28, 0.9);
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            z-index: 50;
            cursor: ns-resize;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(1px);
        }

        /* 入力テスト用インプット */
        .test-input {
            border: 2px solid #cbd5e1;
            border-radius: 0.375rem;
            padding: 0.15rem 0.5rem;
            margin: 0.15rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
            background-color: #ffffff;
            transition: all 0.2s;
            min-width: 5rem;
            max-width: 14rem;
        }
        .test-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .test-input.correct {
            border-color: #10b981;
            background-color: #ecfdf5;
            color: #047857;
        }
        .test-input.incorrect {
            border-color: #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-rose-500 to-amber-500 flex items-center justify-center text-white font-bold shadow-sm">
                        政経
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-800 leading-tight">政治・経済 暗記マスター</h1>
                        <p class="text-xs text-slate-500">学問のすゝめ（解説・原文）＆ 3年2期 経済分野</p>
                    </div>
                </div>

                <!-- 全体進捗バー -->
                <div class="flex items-center gap-3 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                    <div class="text-xs font-medium text-slate-600">
                        習得率: <span id="mastery-percent" class="font-bold text-rose-600 text-sm">0%</span>
                        <span class="text-slate-400 ml-1">(<span id="mastered-count">0</span>/<span id="total-count">0</span>)</span>
                    </div>
                    <div class="w-24 h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div id="mastery-bar" class="h-full bg-gradient-to-r from-rose-500 to-amber-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <button onclick="resetProgress()" title="進捗をリセット" class="text-xs text-slate-400 hover:text-rose-600 transition-colors p-1">
                        ↺
                    </button>
                </div>
            </div>

            <!-- カテゴリタブ -->
            <div class="flex gap-1.5 mt-3 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="switchTab('gakumon_summary')" id="tab-gakumon_summary" class="tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold whitespace-nowrap transition-all bg-rose-600 text-white shadow-sm">
                    📘 学問のすゝめ（解説・要約編）
                </button>
                <button onclick="switchTab('gakumon_text')" id="tab-gakumon_text" class="tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold whitespace-nowrap transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
                    📜 学問のすゝめ（原文読解編）
                </button>
                <button onclick="switchTab('economy')" id="tab-economy" class="tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-bold whitespace-nowrap transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
                    📈 3年2期 経済分野
                </button>
            </div>
        </div>

        <!-- コントロールバー -->
        <div class="bg-slate-50 border-t border-slate-200 px-4 py-2">
            <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">
                <!-- 学習モード切替 -->
                <div class="flex items-center bg-white p-1 rounded-lg border border-slate-200 shadow-xs">
                    <button onclick="setMode('tap')" id="mode-tap" class="px-2.5 py-1 rounded-md font-bold bg-slate-800 text-white transition-all">
                        👆 タップ暗記
                    </button>
                    <button onclick="setMode('input')" id="mode-input" class="px-2.5 py-1 rounded-md font-bold text-slate-600 hover:bg-slate-100 transition-all">
                        ⌨️ 入力テスト
                    </button>
                    <button onclick="setMode('sheet')" id="mode-sheet" class="px-2.5 py-1 rounded-md font-bold text-slate-600 hover:bg-slate-100 transition-all">
                        🟥 可動赤シート
                    </button>
                </div>

                <!-- 一括操作・フィルター -->
                <div class="flex flex-wrap items-center gap-1.5">
                    <button onclick="hideAll()" class="px-2.5 py-1.5 bg-white border border-slate-200 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 rounded-lg font-medium text-slate-700 transition-colors shadow-2xs">
                        🙈 すべて隠す
                    </button>
                    <button onclick="revealAll()" class="px-2.5 py-1.5 bg-white border border-slate-200 hover:bg-amber-50 hover:text-amber-700 hover:border-amber-200 rounded-lg font-medium text-slate-700 transition-colors shadow-2xs">
                        👁️ すべて表示
                    </button>
                    <button onclick="shuffleCards()" class="px-2.5 py-1.5 bg-white border border-slate-200 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 rounded-lg font-medium text-slate-700 transition-colors shadow-2xs">
                        🔀 シャッフル
                    </button>
                    <label class="flex items-center gap-1.5 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 select-none shadow-2xs">
                        <input type="checkbox" id="filter-unmastered" onchange="renderCards()" class="rounded text-rose-600 focus:ring-rose-500">
                        <span class="font-medium text-slate-700">未習得のみ</span>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <!-- サブカテゴリフィルター（セクションジャンプ） -->
    <div class="max-w-5xl w-full mx-auto px-4 pt-3">
        <div id="section-pills" class="flex gap-1.5 overflow-x-auto pb-2 text-xs">
            <!-- JSで動的生成 -->
        </div>
    </div>

    <!-- メインコンテンツエリア -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-3 pb-28">
        <!-- 入力テストモード時の採点バー -->
        <div id="test-action-bar" class="hidden mb-4 bg-blue-50 border border-blue-200 rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
            <div class="text-xs sm:text-sm text-blue-800 font-medium">
                ⌨️ 空欄に語句を入力して「まとめて採点」を押してください（全角・半角・一部の別表記も自動判定します）
            </div>
            <div class="flex gap-2">
                <button onclick="gradeAllInputs()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold rounded-lg shadow-sm transition-colors">
                    ⭕ まとめて採点する
                </button>
                <button onclick="clearAllInputs()" class="px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-600 border border-slate-300 text-xs sm:text-sm font-medium rounded-lg transition-colors">
                    クリア
                </button>
            </div>
        </div>

        <!-- カード一覧コンテナ -->
        <div id="cards-container" class="space-y-4">
            <!-- JSで問題カードを生成 -->
        </div>
    </main>

    <!-- 可動式リアル赤シートオーバーレイ -->
    <div id="red-sheet-overlay" class="red-sheet-overlay hidden" style="top: 220px;">
        <div class="flex justify-between items-center text-xs font-bold tracking-wider">
            <span>🟥 赤シート（上下にドラッグして移動）</span>
            <button onclick="setMode('tap')" class="bg-black/30 hover:bg-black/50 px-2 py-0.5 rounded text-white">閉じる ✕</button>
        </div>
        <div class="text-center text-xs opacity-80 pointer-events-none">
            文字の上に重ねると赤・黄色の重要語句が隠れます
        </div>
        <div class="flex justify-center">
            <div class="w-12 h-1.5 bg-white/50 rounded-full"></div>
        </div>
    </div>

    <!-- トースト通知用 -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        通知メッセージ
    </div>

    <script>
        // ==========================================
        // データ定義（3つのPDFの全穴埋め・赤黄色文字を網羅）
        // 書式: {{答え|別解1,別解2|color}}  color: red(赤字) / yellow(黄色ハイライト)
        // ==========================================
        const studyData = {
            gakumon_summary: [
                // --- 成立・基本事項 ---
                {
                    id: "gs_1",
                    section: "成立・基本事項",
                    title: "「学問のすゝめ」初編の成立と出版の経緯",
                    content: "「学問のすゝめ」初編の成立は{{明治5年2月|明治五年二月|red}}である。もともとは{{私立中津市学校|中津市学校|yellow}}の生徒向けに書かれたが、内容が評価され世間に広まった。初編の同著（共著）は{{小幡篤次郎|小幡甚三郎|red}}で、彼は{{中津市学校教員|中津市学校の教員|yellow}}であった。"
                },
                {
                    id: "gs_2",
                    section: "成立・基本事項",
                    title: "二編〜十七編の成立時期と合本・繋がり",
                    content: "二編は明治{{6年1月|yellow}}、三編は{{6年12月|yellow}}、四編・五編は{{7年1月|yellow}}、六編は{{7年2月|同2月|yellow}}、七編は{{7年3月|3月|yellow}}、八編は{{7年4月|4月|yellow}}、九編は{{7年5月|5月|yellow}}、十編は{{7年6月|6月|yellow}}、十一編は{{7年7月|7月|yellow}}、十二編・十三編は{{7年12月|同12月|yellow}}、十四編は{{8年3月|yellow}}、十五編は{{9年7月|yellow}}、十六編は{{9年8月|yellow}}、十七編は{{9年11月|yellow}}に成立した。<br>合本が出版されたのは{{明治13年7月|red}}であり、一般大衆にも読みやすいように主に{{平仮名|ひらがな|red}}（仮名交じり文）で書かれた。<br>内容に繋がりがある編の組み合わせは、{{1-3|1・3|yellow}}、{{4-5|4・5|yellow}}、{{6-7|6・7|yellow}}、{{8-11|8・11|yellow}}、{{9-10|9・10|yellow}}である。"
                },
                {
                    id: "gs_3",
                    section: "初編・二編",
                    title: "初編のキーワード（分限・実学・王政一新・開闢）",
                    content: "初編・二編・三編・六編・七編は主に{{社会|red}}についての議論である。<br>「学問をするには{{分限|red}}を知る事肝要なり」の「分限」とは、{{社会人としての自己の立場|自己の立場|yellow}}という意味である。これを守らない自由は{{我儘・放蕩|我儘放蕩,わがまま・ほうとう|red}}に陥る。<br>また、明治維新を指す「王政一度新たなりし」とは{{王政復古|王政一新|yellow}}のことであり、「開闢（かいびゃく）」とは{{国の始まり|世界の始まり,歴史の始まり|yellow}}を意味する。"
                },
                {
                    id: "gs_4",
                    section: "初編・二編",
                    title: "初編要約：天は人の上に人を造らずと「実学」",
                    content: "天は人の{{上|red}}に人を造らず、人の下に人を{{造らず|red}}とはよく言うが、現実には{{貧富貴賤|賢愚・貧富|yellow}}の差がある。学問をするものは身分が高く富み、{{無学|yellow}}な人は{{貧乏|yellow}}で下人になる。ここでいう学問とは単なる文字の暗記ではなく、{{実学|red}}のことを言う。具体的には、{{地理|red}}・{{究理|red}}（物理学）・{{歴史|red}}・{{経済|red}}・修身などがあり、これらを学ぶことで個人・家・国家が独立する。外国に対抗して自国を発展させ自由を守り、良い政治を行うために人民が学問をすることが大切だ。"
                },
                {
                    id: "gs_5",
                    section: "初編・二編",
                    title: "二編のキーワード（論語読み・通義・私立の活計・互恵と平等）",
                    content: "・「論語読みの論語知らず」とは、{{論語を訓読できるだけでその内容を理解できない人|yellow}}のこと。<br>・現在でいう「権利」のことを福澤諭吉は{{通義|red}}といい、英語では{{right|ライト|red}}という。<br>・「私立の活計」とは、{{経済的に独立した暮らし|経済的独立|yellow}}のこと。<br>・「レシプロシチ（reciprocity）」とは{{互恵|red}}、「エクウヲリチ（equality）」とは{{平等|red}}のことである。"
                },
                {
                    id: "gs_6",
                    section: "初編・二編",
                    title: "二編要約：人民と政府の対等な関係と暴政の回避",
                    content: "人は常に人として{{同等|対等|yellow}}であることを忘れてはいけない。また、人民と政府も{{同等|対等|red}}でなければならない。政府は{{法|法律|yellow}}を作り、人民は法を守るというお互いの契約を守るべきである。政府が{{暴政|red}}を行うことがあるが、それは君主だけのせいではなく、人民が無知なせいでもある。人民が{{無知|yellow}}のせいで犯罪を犯すと政府は無慈悲な政治をしなくてはいけなくなるため、暴政を避けたいなら、学問によって{{智徳|見識|yellow}}を高め、政府と{{同等|対等|red}}の地位に登らなければならない。"
                },
                // --- 三編・四編・五編 ---
                {
                    id: "gs_7",
                    section: "三編〜五編",
                    title: "三編の語句と要約：独立の気力と3つの害",
                    content: "・「戈を倒にする」とは{{裏切る事|裏切ること|yellow}}である。<br>・「仏蘭西と孛魯西（プロイセン）との戦」とは{{普仏戦争|red}}のことで、フランス軍はプロイセンに敗北し、ナポレオン3世は{{捕虜|red}}になったが、パリ市民は抵抗を続けた。<br>・国と国も富強に関わらず対等であり、そのためには国中の人民に{{独立の気力|red}}がなければならない。独立の気力がない人の3つの害：①{{国を思うこと切ならず|愛国心が持てない|yellow}}（今川義元が討たれた時に家臣が逃げ去ったのに対し、フランス人は戦い続けた）。②内で独立していない者は外国人と接するときも{{独立の権利|yellow}}を持つことができず、人を恐れへつらう。③人に依頼して{{悪事|yellow}}をすることがあり、他人の威を借りて取引しようとする。"
                },
                {
                    id: "gs_8",
                    section: "三編〜五編",
                    title: "四編・五編の語句（君子・スピリット・奢侈・ミドルクラス）",
                    content: "・学問に通じ徳の高い立派な人のことを{{君子|red}}という。<br>・上下で隔絶してしまった無形の気風のことを{{スピリット|spirit|red}}と言っている。<br>・贅沢のことを{{奢侈|しゃし|red}}という。<br>・蒸気機関を発明したのは{{ワット|ジェームズ・ワット|red}}、鉄道は{{スティーブンソン|red}}、経済学は{{アダム・スミス|アダムスミス|red}}であり、この人たちは{{中産階級|ミドルクラス,middle class|red}}（ミドルクラス）の人々である。<br>・「社中」とは{{仲間|結社,グループ|yellow}}のことである。"
                },
                {
                    id: "gs_9",
                    section: "三編〜五編",
                    title: "四編・五編要約：文明の精神と民間の役割",
                    content: "四編：国の独立を保つには政府と人民がともに力を出さなければならない。現在我が国に足りないのは学術と{{商売|yellow}}と法律である。政府は依然として{{専制|yellow}}政府であり、人民は無気力のままである。人民を導くべき洋学者は{{官職|yellow}}を求めてばかりで頼れないため、我々は民間の立場で学術・商売・法律を実践し、{{演説|yellow}}や新聞などで政府を批判し人民を導くべきだ。<br>五編：文明というのは形のある外見を指すのではなく、人民の{{気力|スピリット|red}}（文明の精神）が一番大切だ。西洋の文明は{{中産階級|ミドルクラス|red}}から興り、政府の役割はそれを保護することである。"
                },
                // --- 六編・七編・評 ---
                {
                    id: "gs_10",

        // ==========================================

        // ==========================================

        function toggleMastered(cardId) {

            updateMasteryUI();

            renderCards();
            showToast('🔀 出題順をシャッフルしました');

        // テキスト内の {{答え|別解|色}} をモードに応じたHTMLに変換
        function parseContent(rawHtml, cardId) {
            let blankIndex = 0;
            return rawHtml.replace(/\{\{([^}]+)\}\}/g, (match, inner) => {
                const parts = inner.split('|');
                const answer = parts[0].trim();
                const alts = parts[1] ? parts[1].trim() : '';
                const color = parts[2] ? parts[2].trim() : 'red';
                const uid = `${cardId}_b_${blankIndex++}`;

                if (currentMode === 'tap') {
                    const colorClass = color === 'yellow' ? 'blank-yellow' : 'blank-red';
                    return `<span id="${uid}" onclick="toggleBlank('${uid}')" class="${colorClass} hidden-ans relative" title="クリックで表示/非表示">${answer}</span>`;
                } else if (currentMode === 'input') {
                    const widthCh = Math.max(answer.length * 1.4, 5);
                    return `<span class="inline-flex items-center align-baseline">
                        <input type="text" id="${uid}" data-ans="${answer}" data-alts="${alts}" 
                            style="width: ${widthCh}em;" 
                            class="test-input" placeholder="入力..." 
                            onkeydown="if(event.key==='Enter') checkSingleInput('${uid}')">
                        <button onclick="showHintForInput('${uid}')" title="答えを見る" class="text-xs text-slate-400 hover:text-amber-600 px-1">💡</button>
                    </span>`;
                } else if (currentMode === 'sheet') {
                    const sheetClass = color === 'yellow' ? 'real-sheet-target-yellow font-bold underline decoration-amber-400' : 'real-sheet-target-red font-bold underline decoration-rose-300';
                    return `<span class="${sheetClass} px-1">${answer}</span>`;
                }
            });
        }

        function renderCards() {

            const orderedItems = cardOrder[currentTab].map(idx => studyData[currentTab][idx]);

            const filteredItems = orderedItems.filter(item => {
                if (currentSectionFilter !== 'ALL' && item.section !== currentSectionFilter) return false;
                if (onlyUnmastered && masteredIds.has(item.id)) return false;
                return true;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center shadow-2xs">
                        <div class="text-4xl mb-2">🎊</div>
                        <h3 class="text-base font-bold text-slate-800">表示する問題がありません</h3>

                    </div>
                `;
                return;
            }

            container.innerHTML = filteredItems.map((item, idx) => {
                const isMastered = masteredIds.has(item.id);
                const parsedBody = parseContent(item.content, item.id);
                const badgeColor = currentTab === 'economy' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-rose-50 text-rose-700 border-rose-200';

                return `
                <article class="bg-white rounded-2xl border ${isMastered ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200'} p-4 sm:p-5 shadow-2xs transition-all">

                            <span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-md border ${badgeColor} mb-1">
                                ${item.section}
                            </span>
                            <h2 class="text-sm sm:text-base font-bold text-slate-800">
                                Q${idx + 1}. ${item.title}
                            </h2>
                        </div>
                        <div class="flex items-center gap-1.5">
                            ${currentMode === 'tap' ? `

                                </button>

                                ${isMastered ? '✓ 習得済' : '○ 覚えた'}
                            </button>
                        </div>
                    </div>
                    <div class="text-sm sm:text-[15px] leading-loose text-slate-700">
                        ${parsedBody}
                    </div>
                </article>
                `;
            }).join('');
        }

        // ==========================================
        // タップ暗記操作
        // ==========================================
        function toggleBlank(uid) {
            const el = document.getElementById(uid);
            if (!el) return;
            if (el.classList.contains('hidden-ans')) {
                el.classList.remove('hidden-ans');
                el.classList.add('revealed');
            } else {
                el.classList.remove('revealed');
                el.classList.add('hidden-ans');
            }
        }

        function toggleCardBlanks(cardId) {
            const blanks = document.querySelectorAll(`[id^="${cardId}_b_"]`);
            const anyHidden = Array.from(blanks).some(b => b.classList.contains('hidden-ans'));
            blanks.forEach(b => {
                if (anyHidden) {
                    b.classList.remove('hidden-ans');
                    b.classList.add('revealed');
                } else {
                    b.classList.remove('revealed');
                    b.classList.add('hidden-ans');
                }
            });
        }

        function hideAll() {
            if (currentMode !== 'tap') setMode('tap');
            document.querySelectorAll('.blank-red, .blank-yellow').forEach(el => {
                el.classList.remove('revealed');
                el.classList.add('hidden-ans');
            });
            showToast('🙈 すべての空欄を隠しました');
        }

        function revealAll() {
            if (currentMode !== 'tap') setMode('tap');
            document.querySelectorAll('.blank-red, .blank-yellow').forEach(el => {
                el.classList.remove('hidden-ans');
                el.classList.add('revealed');
            });
            showToast('👁️ すべての答えを表示しました');
        }

        // ==========================================
        // 入力テスト採点ロジック
        // ==========================================
        function normalizeStr(str) {
            return str
                .replace(/\s+/g, '')
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .replace(/・/g, '')
                .replace(/−/g, '-')
                .replace(/ー/g, '-')
                .toLowerCase();
        }

        function checkSingleInput(uid) {
            const input = document.getElementById(uid);
            if (!input) return false;
            const userVal = normalizeStr(input.value);
            if (!userVal) {
                input.classList.remove('correct', 'incorrect');
                return false;
            }

            const ans = normalizeStr(input.dataset.ans);
            const alts = input.dataset.alts ? input.dataset.alts.split(',').map(normalizeStr) : [];
            const isCorrect = (userVal === ans) || alts.includes(userVal);

            input.classList.remove('correct', 'incorrect');
            if (isCorrect) {
                input.classList.add('correct');
                return true;
            } else {
                input.classList.add('incorrect');
                return false;
            }
        }

        function showHintForInput(uid) {
            const input = document.getElementById(uid);
            if (!input) return;
            input.value = input.dataset.ans;
            input.classList.remove('incorrect');
            input.classList.add('correct');
        }

        function gradeAllInputs() {
            const inputs = document.querySelectorAll('.test-input');
            let total = inputs.length;
            let correctCount = 0;

            inputs.forEach(inp => {
                if (checkSingleInput(inp.id)) correctCount++;
            });

            showToast(`採点結果: ${total}問中 ${correctCount}問 正解！`);
        }

        function clearAllInputs() {
            document.querySelectorAll('.test-input').forEach(inp => {
                inp.value = '';
                inp.classList.remove('correct', 'incorrect');
            });
        }

        // ==========================================
        // 可動式リアル赤シートのドラッグ処理
        // ==========================================
        const sheetEl = document.getElementById('red-sheet-overlay');
        let isDragging = false;
        let startY = 0;
        let initialTop = 220;

        sheetEl.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            startY = e.clientY;
            initialTop = sheetEl.offsetTop;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaY = e.clientY - startY;
            const newTop = Math.max(60, Math.min(window.innerHeight - 100, initialTop + deltaY));
            sheetEl.style.top = `${newTop}px`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        sheetEl.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            startY = e.touches[0].clientY;
            initialTop = sheetEl.offsetTop;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaY = e.touches[0].clientY - startY;
            const newTop = Math.max(60, Math.min(window.innerHeight - 100, initialTop + deltaY));
            sheetEl.style.top = `${newTop}px`;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        // ==========================================
        // トースト通知
        // ==========================================
        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2400);
        }

        // 初期起動
        window.onload = () => {
            updateMasteryUI();
            renderSectionPills();
            renderCards();
        };
    </script>
</body>
</html>
